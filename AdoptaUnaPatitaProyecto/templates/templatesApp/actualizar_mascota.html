{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Mascota</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bodygeneral">

<div class="mascotas-container">

    <h2 style="text-align:center; color:#ff6600;">✏️ Actualizar Mascota</h2>

    {% if messages %}
        {% for message in messages %}
            <p style="color:red; text-align:center;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" style="max-width:400px; margin:auto;">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" style="background:#00b7ff; color:white; font-weight:bold;">
            Guardar Cambios
        </button>
    </form>

    <div style="text-align:center; margin-top:20px;">
        <a href="{% url 'listar_mascotas' %}?rol={{ rol }}" class="listar_mascotas">Volver</a>
    </div>

</div>

</body>
</html>
