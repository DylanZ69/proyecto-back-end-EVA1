{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Enviar Solicitud</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bodygeneral">

<div class="form-solicitud-container">
    
    {% if error %}
        <div class="error-solicitud">
            {% for campo, mensajes in error.items %}
                {% for mensaje in mensajes %}
                    <p>{{ mensaje }}</p>
                {% endfor %}
            {% endfor %}
        </div>
    {% endif %} 

    <form method="POST" action="{% url 'crear_solicitud' %}">
        {% csrf_token %}
        <label for="nombre_adoptante">Nombre del Adoptante:</label>
        <input type="text" name="nombre_adoptante" id="nombre_adoptante" required>

        <label for="correo_adoptante">Correo del Adoptante:</label>
        <input type="email" name="correo_adoptante" id="correo_adoptante" required>

        <label for="mascota">Mascota:</label>
        <select name="mascota" id="mascota" required>
            <option value="">Selecciona una mascota</option>
            {% for mascota in mascotas %}
                <option value="{{ mascota.id }}">{{ mascota.nombre }} ({{ mascota.tipo }})</option>
            {% endfor %}
        </select>

        <button type="submit" class="formulariosolicitud">Enviar Solicitud</button>
    </form>

    <div style="text-align:center; margin-top:20px;">
        <a href="{% url 'menu' %}?rol={{ rol }}" class="volversolicitudes">Volver</a>
    </div>
</div>

</body>
</html>
