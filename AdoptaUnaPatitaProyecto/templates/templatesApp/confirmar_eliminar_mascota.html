{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Mascota</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bodygeneral">

<div class="mascotas-container">

    <h2 style="text-align:center; color:red;">⚠️ Eliminar Mascota</h2>

    <p style="text-align:center;">
        ¿Estás seguro de eliminar la mascota <strong>{{ mascota.nombre }}</strong>?
    </p>

    <form method="POST" style="text-align:center; margin-top:20px;">
        {% csrf_token %}

        <button type="submit" 
                style="background:red; color:white; font-weight:bold; padding:10px 20px;">
            Sí, eliminar
        </button>
    </form>

    <div style="text-align:center; margin-top:20px;">
        <a href="{% url 'listar_mascotas' %}?rol={{ rol }}" 
           style="color:#00b7ff; font-weight:bold;">
            Cancelar
        </a>
    </div>

</div>

</body>
</html>
