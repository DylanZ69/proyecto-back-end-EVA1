{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Refugio</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bodygeneral">

<div class="mascotas-container" style="max-width:500px; margin:auto;">

    <h2 style="text-align:center; color:red;">Eliminar Refugio</h2>

    <p style="text-align:center;">
        ¿Estás seguro que deseas eliminar el refugio
        <strong>{{ refugio.nombre }}</strong>?
    </p>

    <form method="POST" style="text-align:center;">
        {% csrf_token %}
        <button type="submit" style="background:red; color:white; padding:10px;">
            Sí, eliminar
        </button>
    </form>

    <div style="text-align:center; margin-top:20px;">
        <a href="{% url 'ver_refugios' %}" class="boton-volver">Cancelar</a>
    </div>

</div>

</body>
</html>
