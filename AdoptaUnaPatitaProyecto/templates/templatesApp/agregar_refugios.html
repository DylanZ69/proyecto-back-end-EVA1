{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Refugio</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bodygeneral">

<div class="mascotas-container">

    <h2 style="text-align:center; color:#00b7ff;">Agregar Refugio</h2>

    {% if messages %}
        <div style="text-align:center;">
            {% for m in messages %}
                <p style="color:red; font-weight:bold;">{{ m }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" style="max-width:400px; margin:auto;">
        {% csrf_token %}

        <p>
            <label>Nombre</label><br>
            <input type="text" name="nombre" required>
        </p>

        <p>
            <label>Dirección</label><br>
            <input type="text" name="direccion" required>
        </p>

        <p>
            <label>Teléfono</label><br>
            <input type="text" name="telefono" required>
        </p>

        <button type="submit" style="background:#00b7ff; color:white; font-weight:bold;">
            Guardar
        </button>
    </form>

    <div style="text-align:center; margin-top:20px;">
        <a href="{% url 'ver_refugios' %}">
            <button class="boton-volver">Volver</button>
        </a>
    </div>
</div>

</body>
</html>
