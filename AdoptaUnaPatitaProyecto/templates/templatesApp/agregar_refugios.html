{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Refugio</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bodygeneral">



<form id="formRefugio"class="form-mascotaa">
    <label>Nombre:</label>
    <input type="text" id="nombre" required>

    <label>Dirección:</label>
    <input type="text" id="direccion" required>

    <label>Teléfono:</label>
    <input type="text" id="telefono" required>

    <button type="submit">Guardar</button>
    <p id="mensaje" style="font-weight:bold; margin-top:15px;"></p>
</form>

<a href="{% url 'menu' %}?rol={{ rol }}">
    <button class="boton-volver">Volver al Menú</button>
</a>

<script>
document.getElementById("formRefugio").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        nombre: document.getElementById("nombre").value,
        direccion: document.getElementById("direccion").value,
        telefono: document.getElementById("telefono").value
    };

    try {
        const response = await fetch("{% url 'crear_refugio' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            document.getElementById("mensaje").style.color = "green";
            document.getElementById("mensaje").textContent = "Refugio creado correctamente";
            setTimeout(() => {
                window.location.href = "{% url 'menu' %}?rol={{ rol }}";
            }, 1500);
        } else {
            document.getElementById("mensaje").style.color = "red";
            document.getElementById("mensaje").textContent = result.error;}
        
    } catch (error) {
        document.getElementById("mensaje").textContent = "Error de conexión con el servidor.";
    }
});
</script>

</body>
</html>
